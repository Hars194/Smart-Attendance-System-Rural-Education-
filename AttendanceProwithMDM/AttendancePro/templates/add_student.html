{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4 mt-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3>{{ 'Edit Student' if student else 'Add New Student' }}</h3>
                <a href="javascript:history.back()" class="btn btn-secondary">Back</a>
            </div>

            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label>Full Name</label>
                    <input type="text" name="name" class="form-control" value="{{ student.name if student else '' }}" required>
                </div>
                <div class="mb-3">
                    <label>RFID Card UID</label>
                    <input type="text" name="rfid" class="form-control" value="{{ student.rfid_uid if student else '' }}" required>
                </div>
                
                <div class="mb-3">
                    <label>Classroom</label>
                    {% if prefill_class %}
                        <input type="text" name="classroom" class="form-control" value="{{ prefill_class }}" readonly>
                    {% else %}
                        <input type="text" name="classroom" class="form-control" value="{{ student.classroom if student else '' }}" placeholder="e.g. 10-A" required>
                    {% endif %}
                </div>

                <div class="mb-3">
                    <label>Face Image {{ '(Leave empty to keep current)' if student else '' }}</label>
                    <input type="file" name="image" class="form-control" accept="image/*" {{ 'required' if not student else '' }}>
                </div>
                <button type="submit" class="btn btn-success w-100">{{ 'Update' if student else 'Save' }}</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
