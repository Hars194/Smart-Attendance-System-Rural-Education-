{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">{{ t['login'] }}</div>
            <div class="card-body">
                <form id="loginForm">
                    <div class="mb-3">
                        <label>{{ t['username'] }}</label>
                        <input type="text" id="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>{{ t['password'] }}</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="loginBtn">{{ t['login'] }}</button>
                    <p id="errorMsg" class="text-danger mt-2 text-center"></p>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');
    
    // UI Feedback
    btn.disabled = true;
    btn.innerText = "Authenticating..."; // Keeping status messages in English for simplicity
    errorMsg.innerText = "";

    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    try {
        // 1. CALL THE API
        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
            // 2. SUCCESS: READ REDIRECT URL & GO
            btn.innerText = "Redirecting...";
            window.location.href = data.redirect_url; 
        } else {
            // FAILURE
            errorMsg.innerText = data.message || "Login Failed";
            btn.disabled = false;
            // 5. IMPORTANT: Reset button text to the correct language on failure
            btn.innerText = "{{ t['login'] }}"; 
        }
    } catch (err) {
        console.error(err);
        errorMsg.innerText = "Server Error";
        btn.disabled = false;
        // 6. IMPORTANT: Reset button text to the correct language on error
        btn.innerText = "{{ t['login'] }}";
    }
});
</script>
{% endblock %}
